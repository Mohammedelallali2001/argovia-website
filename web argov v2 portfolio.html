<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg-deep:#080412; --bg-card:#140c26;
    --cream:#f5edca; --gold:#f4e18b; --lavender:#a892c8;
    --text-primary:#f5edca; --text-muted:#6a6560;
    --line:rgba(244,225,139,0.09);
  }
  html { scroll-behavior:smooth; background:var(--bg-deep); overflow-x:hidden; }
  body {
    font-family:'Outfit',sans-serif; color:var(--text-primary); background:var(--bg-deep);
    overflow-x:hidden; font-size:15px; line-height:1.6; font-weight:300;
  }
  a { color:inherit; text-decoration:none; }

  #star-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .site-wrap { position:relative; z-index:1; min-height:100vh; }

  .c { max-width:960px; margin:0 auto; padding:0 20px; }
  section { padding:40px 0; }

  h2 { font-size:clamp(24px,5vw,34px); font-weight:700; letter-spacing:-0.5px; margin-bottom:6px; }

  nav {
    position:sticky; top:0; z-index:100;
    padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
    background:rgba(8,4,18,0.92); backdrop-filter:blur(14px);
    border-bottom:2px dashed var(--line);
  }
  .logo { font-size:20px; font-weight:700; color:var(--gold); }
  .logo span { color:var(--lavender); font-size:16px; }
  .nav-back {
    display:inline-flex; align-items:center; gap:6px;
    font-size:14px; color:var(--text-muted); padding:6px 14px;
    border:1px dashed var(--line); border-radius:20px; transition:0.3s;
  }
  .nav-back:hover { color:var(--gold); border-color:var(--line-strong); }

  .cat { margin-bottom:40px; }
  .cat-header {
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
    font-size:18px; font-weight:400; color:var(--lavender);
    border-bottom:2px dotted var(--line); padding-bottom:8px;
  }
  .cat-header::before { content:'//'; opacity:0.5; }
  .cat-header span { font-size:13px; color:var(--text-muted); margin-left:auto; }

  .vid-g { display:grid; grid-template-columns:1fr; gap:16px; }

  .vid-c {
    background:var(--bg-card); border:1px solid var(--line); border-radius:16px;
    overflow:hidden; transition:0.3s;
  }
  .vid-c iframe { width:100%; display:block; aspect-ratio:16/9; border:none; background:#000; }

  @media (min-width:600px) { .vid-g { grid-template-columns:repeat(2,1fr); } }
  @media (min-width:900px) { .vid-g { grid-template-columns:repeat(3,1fr); } }

  .footer-text { text-align:center; padding:24px 0 16px; font-size:12px; color:var(--text-muted); border-top:1px dashed var(--line); }

  @media (prefers-reduced-motion:reduce) { #star-canvas { display:none; } }
</style>
</head>

<script>
const c=document.getElementById('star-canvas'),x=c.getContext('2d');
let W,H,s=[];
function rs(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
rs();window.addEventListener('resize',rs);
s=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.3,a:Math.random()*0.35+0.1,d:Math.random()*0.015+0.003}));
// Shooting stars
let ss=[],st=0;
function ssSpawn(){const g=0.2+Math.random()*0.4;const sp=3+Math.random()*5;ss.push({x:Math.random()*W*0.8+W*0.1,y:-10,vx:Math.cos(g)*sp,vy:Math.sin(g)*sp,l:1,d:0.008+Math.random()*0.012,n:60+Math.random()*80,r:Math.random()*1.2+0.8});}
(function a(){x.clearRect(0,0,W,H);s.forEach(t=>{t.y-=t.d;if(t.y<-2){t.y=H+2;t.x=Math.random()*W;}x.beginPath();x.arc(t.x,t.y,t.r,0,Math.PI*2);x.fillStyle=`rgba(245,237,202,${t.a})`;x.fill();});st++;if(st>150+Math.random()*300){ssSpawn();st=0;}for(let i=ss.length-1;i>=0;i--){const z=ss[i];z.x+=z.vx;z.y+=z.vy;z.l-=z.d;if(z.l<=0){ss.splice(i,1);continue;}const tx=z.x-z.vx*z.n*0.5,ty=z.y-z.vy*z.n*0.5;const g=x.createLinearGradient(tx,ty,z.x,z.y);g.addColorStop(0,`rgba(244,225,139,0)`);g.addColorStop(0.3,`rgba(244,225,139,${z.l*0.4})`);g.addColorStop(0.7,`rgba(245,237,202,${z.l*0.7})`);g.addColorStop(1,`rgba(255,255,255,${z.l*0.9})`);x.beginPath();x.moveTo(tx,ty);x.lineTo(z.x,z.y);x.strokeStyle=g;x.lineWidth=z.r;x.lineCap='round';x.stroke();x.beginPath();x.arc(z.x,z.y,z.r*1.5,0,Math.PI*2);x.fillStyle=`rgba(255,255,255,${z.l*0.8})`;x.fill();}requestAnimationFrame(a);})();
</script>
