<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — ARGOV</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .err {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 40px var(--gutter);
    }

    .err-card {
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .err-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.04em;
      color: var(--ink);
    }

    .err-brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }

    .err-mascot {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 130px;
      margin-bottom: 30px;
    }

    .e-slab {
      width: 44px;
      border-radius: 12px 12px 4px 10px;
      border-top: 3px solid rgba(243, 240, 233, 0.85);
      margin-left: -6px;
      box-shadow: 0 18px 30px -18px rgba(12, 12, 12, 0.5);
    }

    .e-b1 { background: #0c0c0c; height: 118px; transform: skewX(-14deg); z-index: 1; }
    .e-b2 { background: #2451f5; height: 92px; transform: skewX(-8deg); z-index: 2; }
    .e-b3 { background: #f97415; height: 72px; transform: skewX(0deg); z-index: 3; }
    .e-b4 { background: #f8c630; height: 60px; transform: skewX(6deg); z-index: 4; }

    .err-code {
      font-size: clamp(84px, 18vw, 160px);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.85;
      color: var(--ink);
    }

    .err-code em { color: var(--red); font-style: normal; }

    .err-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(26px, 4vw, 40px);
      margin: 20px 0 10px;
    }

    .err-text {
      color: var(--muted);
      max-width: 34ch;
      margin: 0 auto 30px;
    }

    .err-card .button { margin: 0 6px 10px; }
  </style>
</head>
<body>
  <main class="err">
    <div class="err-card">
      <a class="err-brand" href="index.html">Argov<span class="dot"></span></a>

      <div class="err-mascot" aria-hidden="true">
        <span class="e-slab e-b1"></span>
        <span class="e-slab e-b2"></span>
        <span class="e-slab e-b3"></span>
        <span class="e-slab e-b4"></span>
      </div>

      <div class="err-code">4<em>0</em>4</div>
      <p class="err-title">This page wandered off.</p>
      <p class="err-text">The page you’re looking for doesn’t exist — but the studio is still here. Let’s get you back on track.</p>

      <a class="button button-dark" href="index.html">Back to home <span>↗</span></a>
      <a class="button button-light" href="index.html#contact">Contact us <span>↗</span></a>
    </div>
  </main>
</body>
</html>
